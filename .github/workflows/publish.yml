name: Publish MkDocs Site

on:
  push:
    branches:
      - main
  # Triggered by Vertama-GmbH/releases when a new release lands, so the
  # Downloads page picks up the new version without a docs commit. The
  # sending workflow is .github/workflows/notify-docs.yml on the
  # releases repo, dispatched via fine-grained PAT (DOCS_REPO_TOKEN).
  repository_dispatch:
    types:
      - release-updated

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Install dependencies
        run: uv sync

      # Generates docs/Downloads/{index.md,index.de.md} from the public
      # Vertama-GmbH/releases API. The auto-injected GITHUB_TOKEN lifts
      # the unauthenticated rate limit from 60 to 1000 req/hr — not
      # strictly required for one build, but cheap insurance.
      #
      # EXPECTED_RELEASE_TAG, when this workflow was triggered via
      # release-updated dispatch from the source-repo release.yml,
      # carries the tag that was just published. The generator polls
      # the GitHub API (with a 60s budget) until that tag appears,
      # working around the eventual-consistency gap between release
      # creation and list-releases visibility.
      - name: Generate Downloads page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
        run: uv run python scripts/generate-downloads.py

      - name: Deploy to GitHub Pages
        run: uv run mkdocs gh-deploy --force
